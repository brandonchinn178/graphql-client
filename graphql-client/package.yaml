name: graphql-client
version: 1.2.4
verbatim:
  cabal-version: '>= 1.10'
license: BSD3
license-file: LICENSE.md
author:
  - Brandon Chinn <brandonchinn178@gmail.com>
maintainer:
  - Brandon Chinn <brandonchinn178@gmail.com>
category: Graphql
synopsis: A client for Haskell programs to query a GraphQL API
description: A client for Haskell programs to query a GraphQL API.
extra-source-files:
  - README.md
  - CHANGELOG.md
  # test generation files
  - test/Data/GraphQL/Test/Generation/run.sh
  - test/Data/GraphQL/Test/Generation/src/**/*
  - test/Data/GraphQL/Test/Generation/**/*.graphql
  - test/Data/GraphQL/Test/Generation/codegen.yml
  # Make sure graphql-codegen-haskell.js is listed in the Cabal file,
  # in the off-chance it's not built yet
  - ./js/graphql-codegen-haskell.js
  - ./js/**/*

github: brandonchinn178/graphql-client

ghc-options:
  - -Wall
  - -Wcompat
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wnoncanonical-monad-instances
  - -Wunused-packages

library:
  source-dirs: src
  dependencies:
    - aeson
    - aeson-schemas
    - base < 5
    - http-client
    - http-client-tls
    - http-types
    - mtl
    - template-haskell
    - text
    - transformers
    - unliftio-core

executables:
  graphql-codegen:
    main: exe/Codegen.hs
    dependencies:
      - base < 5
      - bytestring
      - file-embed
      - optparse-applicative
      - path
      - path-io >= 1.3.3
      - template-haskell
      - typed-process

tests:
  graphql-client-test:
    source-dirs: test
    main: Main.hs
    dependencies:
      - aeson
      - aeson-schemas
      - base
      - graphql-client
      - mtl
      - process
      - tasty
      - tasty-hunit
